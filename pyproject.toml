[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
include = ["app", "tests"]
extraPaths = ["app/services/renderers"]
